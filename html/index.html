<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibreWXR</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/settings.js"></script>
</head>
<body data-theme="dark">

<div class="toolbar">
    <span class="toolbar-title">LibreWXR</span>
    <form class="lv-search" id="lv-search" role="search">
        <input type="search" id="lv-search-input" placeholder="Search address or place" aria-label="Search address or place" autocomplete="off" enterkeyhint="search">
        <button type="submit" class="icon-btn" id="lv-search-btn" aria-label="Search" title="Search">
            <span class="btn-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></span>
        </button>
    </form>
    <select id="lv-source" aria-label="API source">
        <option value="local">Local (localhost:8080)</option>
        <option value="public">Public (api.librewxr.net)</option>
    </select>
    <select id="lv-layermode" aria-label="Layer mode">
        <option value="radar">Radar</option>
        <option value="satellite">Satellite</option>
        <option value="both">Radar + Satellite</option>
    </select>
    <select id="lv-scheme" aria-label="Color scheme">
        <option value="10">Loading...</option>
    </select>
    <select id="lv-arrows" aria-label="Motion arrows">
        <option value="">Arrows: Off</option>
        <option value="light">Arrows: Light</option>
        <option value="dark">Arrows: Dark</option>
    </select>
    <select id="lv-cells" aria-label="Cell detection">
        <option value="">Cells: Off</option>
        <option value="light">Cells: Light</option>
        <option value="dark">Cells: Dark</option>
    </select>
    <select id="lv-basemap" aria-label="Base map">
        <option value="auto">Map: Auto</option>
        <option value="osm-standard">Map: OSM Standard</option>
        <option value="osm-humanitarian">Map: OSM Humanitarian</option>
        <option value="cyclosm">Map: CyclOSM</option>
        <option value="opentopomap">Map: OpenTopoMap</option>
        <option value="osm-dark">Map: OSM Dark</option>
    </select>
    <div class="toolbar-actions">
        <div class="lv-weather">
            <button type="button" class="icon-btn" id="lv-weather-btn" aria-haspopup="true" aria-expanded="false" aria-controls="lv-weather-menu" aria-label="Current weather" title="Current weather">
                <span class="btn-icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
                <span id="lv-weather-temp">--&deg;</span>
            </button>
            <div class="settings-menu lv-wx-menu" id="lv-weather-menu" role="region" aria-label="Current weather at your location" hidden></div>
        </div>
        <button type="button" class="icon-btn" id="lv-alerts" aria-pressed="false" aria-label="Toggle weather alerts" title="Weather alerts">
            <span class="btn-icon"><svg viewBox="0 0 24 24"><path d="M12 3 L20 19 H4 Z"/><line x1="12" y1="10" x2="12" y2="15"/><circle cx="12" cy="17.5" r="1"/></svg></span>
            Alerts
        </button>
        <button type="button" class="icon-btn" id="lv-options-btn" aria-expanded="false" aria-label="Toggle options panel" title="Options">
            <span class="btn-icon"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="15" cy="17" r="2"/></svg></span>
            Options
        </button>
        <div class="settings">
            <button type="button" class="icon-btn" id="lv-settings-btn" aria-haspopup="true" aria-expanded="false" aria-controls="lv-settings-menu" aria-label="Customize toolbar" title="Customize toolbar">
                <span class="btn-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
            </button>
            <div class="settings-menu" id="lv-settings-menu" role="group" aria-label="Show or hide toolbar items" hidden>
                <div class="settings-menu-title">Show in toolbar</div>
                <label><input type="checkbox" data-key="search"> Address search</label>
                <label><input type="checkbox" data-key="source"> API source</label>
                <label><input type="checkbox" data-key="layermode"> Layer mode</label>
                <label><input type="checkbox" data-key="scheme"> Color scheme</label>
                <label><input type="checkbox" data-key="arrows"> Motion arrows</label>
                <label><input type="checkbox" data-key="cells"> Cell detection</label>
                <label><input type="checkbox" data-key="basemap"> Base map</label>
                <label><input type="checkbox" data-key="weather"> Current weather</label>
                <label><input type="checkbox" data-key="alerts"> Alerts</label>
                <label><input type="checkbox" data-key="options"> Options</label>
                <label><input type="checkbox" data-key="locate"> Locate me</label>
                <button type="button" class="settings-reset" id="lv-settings-reset">Reset to defaults</button>
            </div>
        </div>
    </div>
</div>

<div class="options-panel" id="lv-options">
    <label class="opacity-control" id="lv-opacity-wrap" for="lv-opacity">
        Radar opacity
        <input type="range" id="lv-opacity" min="10" max="100" step="5" value="80">
        <output id="lv-opacity-value" for="lv-opacity">80%</output>
    </label>
    <label><input type="checkbox" id="lv-smooth" checked/> Smoothing</label>
    <label><input type="checkbox" id="lv-snow" checked/> Snow mask</label>
    <label for="lv-format">Format</label>
    <select id="lv-format" aria-label="Tile format">
        <option value="webp">WebP</option>
        <option value="png">PNG</option>
    </select>
    <label for="lv-tilesize">Tile size</label>
    <select id="lv-tilesize" aria-label="Tile size">
        <option value="auto">Auto (device)</option>
        <option value="256">256</option>
        <option value="512">512</option>
    </select>
    <label for="lv-units">Units</label>
    <select id="lv-units" aria-label="Weather units">
        <option value="imperial">Imperial (&deg;F, mph)</option>
        <option value="metric">Metric (&deg;C, km/h)</option>
    </select>
    <button type="button" class="icon-btn" id="lv-theme" aria-label="Switch to light theme" title="Switch to light theme">
        <span class="btn-icon" id="lv-theme-sun"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg></span>
        <span class="btn-icon" id="lv-theme-moon" style="display:none"><svg viewBox="0 0 24 24"><path d="M20 14.5 A8 8 0 0 1 9.5 4 A8 8 0 1 0 20 14.5 Z"/></svg></span>
        <span id="lv-theme-label">Light mode</span>
    </button>
</div>

<div id="lv-map">
    <div class="preload-indicator" id="lv-preload">
        <span id="lv-preload-text">Loading frames 0/0</span>
        <div class="preload-bar"><div class="preload-fill" id="lv-preload-fill"></div></div>
    </div>
    <div class="error-overlay" id="lv-error" role="alert">
        <div class="error-msg" id="lv-error-msg"></div>
        <button type="button" class="retry-btn" id="lv-error-retry" style="display:none">Retry</button>
    </div>
    <div class="refresh-status" id="lv-refresh-status" role="status"></div>
    <button type="button" class="locate-btn" id="lv-locate" aria-label="Locate me" title="Locate me">
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/>
            <line x1="12" y1="2" x2="12" y2="6"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="6" y2="12"/>
            <line x1="18" y1="12" x2="22" y2="12"/>
        </svg>
    </button>
</div>

<div class="replayer">
    <div class="replayer-top">
        <button type="button" class="play-btn" id="lv-play" aria-label="Play playback">
            <svg id="lv-play-icon" viewBox="0 0 16 16"><polygon points="4,2 14,8 4,14"/></svg>
            <svg id="lv-pause-icon" viewBox="0 0 16 16" style="display:none"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg>
        </button>
        <div class="scrubber-wrap">
            <div class="scrubber-track" id="lv-scrubber-track"></div>
            <div class="scrubber-ticks" id="lv-scrubber-ticks"></div>
        </div>
        <div class="timestamp-display" id="lv-timestamp">Loading...</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="js/viewer-core.js"></script>
<script src="js/location.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
<script src="js/weather.js"></script>
</body>
</html>
